name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      # Opcional: si no se configura el secret, las pruebas de integración con Gemini se omiten.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # `auth.ts` valida ambas al importarse, y `next build` importa las rutas.
      # Son marcadores desechables solo para CI: no conectan a ninguna base y
      # sustituyen a los valores reales de .env.local / .env.production.
      BETTER_AUTH_SECRET: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
      DATABASE_URL: postgresql://knowledgedock:ci-only@localhost:5432/knowledgedock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

      - name: Compilar aplicación
        run: npm run build

# GitHub Actions solo es gratuito para este proyecto si el repositorio es público.
